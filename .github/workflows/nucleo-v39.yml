name: V39 offline repair checks
on:
  push:
    branches: [nucleo-v12]
    paths: ['NUCLEO_V39/**','.github/workflows/nucleo-v39.yml']
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 MIGRACAO/verify_integrity.py --all
      - run: python3 NUCLEO_V39/feedback_learning.py --self-test
      - run: python3 MIGRACAO/verify_integrity.py --all
