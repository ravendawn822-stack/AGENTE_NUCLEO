name: NUCLEO V3.1 hierarchy
on:
  push:
    branches: [experimento-04]
    paths:
      - 'NUCLEO_V3_1/**'
      - '.github/workflows/nucleo-v3-1.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: evidencias-cientificas
          path: prior-evidence
          persist-credentials: false
          sparse-checkout: |
            EVIDENCIAS/BRUTOS/NUCLEO_V3
      - name: Verify prior memory file against archived hash
        run: |
          python3 - <<'PY'
          import json,hashlib
          from pathlib import Path
          p=Path('prior-evidence/EVIDENCIAS/BRUTOS/NUCLEO_V3')
          h=next(x['sha256'] for x in json.loads((p/'SHA256.json').read_text()) if x['path']=='memories.json')
          assert hashlib.sha256((p/'memories.json').read_bytes()).hexdigest()==h
          PY
      - run: python3 MIGRACAO/verify_integrity.py --all
      - run: python3 NUCLEO_V3_1/hierarchy.py --self-test
      - run: python3 NUCLEO_V3_1/hierarchy.py --prior prior-evidence/EVIDENCIAS/BRUTOS/NUCLEO_V3/memories.json --output NUCLEO_V3_1/ci
      - run: python3 MIGRACAO/verify_integrity.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-v3-1-results
          path: NUCLEO_V3_1/ci/
          retention-days: 30
  archive:
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidencias-cientificas
      - uses: actions/download-artifact@v4
        with:
          name: nucleo-v3-1-results
          path: EVIDENCIAS/BRUTOS/NUCLEO_V3_1
      - name: Archive exact records
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('EVIDENCIAS/BRUTOS/NUCLEO_V3_1')
          files=[dict(path=str(f.relative_to(p)),bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in sorted(p.rglob('*')) if f.is_file() and not f.is_symlink()]
          assert files
          (p/'SHA256.json').write_text(json.dumps(files,indent=2))
          PY
          git add -f EVIDENCIAS/BRUTOS/NUCLEO_V3_1
          git diff --cached --name-only | awk '!/^EVIDENCIAS\/BRUTOS\/NUCLEO_V3_1\// {exit 1}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive NUCLEO V3.1 hierarchical composition experiment'
          git push origin HEAD:refs/heads/evidencias-cientificas
