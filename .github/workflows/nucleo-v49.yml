name: V49 cumulative motif learning
on:
  push:
    branches: [nucleo-v12]
    paths: ['NUCLEO_V49/**','.github/workflows/nucleo-v49.yml']
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 MIGRACAO/verify_integrity.py --all
      - run: python3 NUCLEO_V49/cumulative_motifs.py --self-test
      - run: python3 NUCLEO_V49/cumulative_motifs.py --output NUCLEO_V49/ci
      - run: python3 MIGRACAO/verify_integrity.py --all
      - name: Record source
        run: printf '%s\n' "$GITHUB_SHA" > NUCLEO_V49/ci/SOURCE_COMMIT.txt
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-v49-results
          path: NUCLEO_V49/ci/
          retention-days: 30
  archive:
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidencias-cientificas
      - name: Refuse overwriting existing evidence
        run: test ! -e EVIDENCIAS/BRUTOS/NUCLEO_V49
      - uses: actions/download-artifact@v4
        with:
          name: nucleo-v49-results
          path: EVIDENCIAS/BRUTOS/NUCLEO_V49
      - name: Archive results
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('EVIDENCIAS/BRUTOS/NUCLEO_V49')
          files=[dict(path=str(f.relative_to(p)),bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in sorted(p.rglob('*')) if f.is_file() and not f.is_symlink()]
          assert files
          (p/'SHA256.json').write_text(json.dumps(files,indent=2))
          PY
          git add -f EVIDENCIAS/BRUTOS/NUCLEO_V49
          git diff --cached --name-only | awk '!/^EVIDENCIAS\/BRUTOS\/NUCLEO_V49\// {exit 1}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive V49 cumulative motif learning experiment'
          git push origin HEAD:refs/heads/evidencias-cientificas
