name: NUCLEO V1.1 synthesis
on:
  push:
    branches: [experimento-04]
    paths:
      - 'NUCLEO_V1_1/**'
      - '.github/workflows/nucleo-v1-1.yml'
permissions:
  contents: read
jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 MIGRACAO/verify_integrity.py --all
      - run: python3 NUCLEO_V1_1/synthesis.py --self-test
      - run: python3 NUCLEO_V1_1/synthesis.py --output NUCLEO_V1_1/ci
      - run: python3 MIGRACAO/verify_integrity.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: nucleo-v1-1-results
          path: NUCLEO_V1_1/ci/
          retention-days: 30
  archive:
    needs: experiment
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidencias-cientificas
      - uses: actions/download-artifact@v4
        with:
          name: nucleo-v1-1-results
          path: EVIDENCIAS/BRUTOS/NUCLEO_V1_1
      - name: Archive records
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          p=Path('EVIDENCIAS/BRUTOS/NUCLEO_V1_1')
          files=[dict(path=str(f.relative_to(p)),bytes=f.stat().st_size,sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in sorted(p.rglob('*')) if f.is_file() and not f.is_symlink()]
          assert files
          (p/'SHA256.json').write_text(json.dumps(files,indent=2))
          PY
          git add -f EVIDENCIAS/BRUTOS/NUCLEO_V1_1
          git diff --cached --name-only | awk '!/^EVIDENCIAS\/BRUTOS\/NUCLEO_V1_1\// {exit 1}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive NUCLEO V1.1 synthesis results'
          git push origin HEAD:refs/heads/evidencias-cientificas
