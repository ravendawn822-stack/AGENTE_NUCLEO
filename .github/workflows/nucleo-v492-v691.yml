name: V492 V691 integrated cognition pilot
on:
  push:
    branches: [nucleo-v12]
    paths: ['.github/workflows/nucleo-v492-v691.yml']
permissions:
  contents: read
jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: python3 MIGRACAO/verify_integrity.py --all
      - run: |
          mkdir -p /tmp/nucleo-v492
          t=0; e=0; i=0
          timeout 60 python3 NUCLEO_V492_V691/test_runtime.py > /tmp/nucleo-v492/tests.log 2>&1 || t=$?
          if [ "$t" = 0 ]; then
            timeout 150 python3 NUCLEO_V492_V691/evaluate.py --out /tmp/nucleo-v492/experiment > /tmp/nucleo-v492/run.log 2>&1 || e=$?
            if [ "$e" = 0 ]; then
              echo "integration is covered by test_runtime.py" > /tmp/nucleo-v492/integration.log
            else i=125; fi
          else e=125; i=125; fi
          printf '{"tests":%s,"experiment":%s,"integration":%s}\n' "$t" "$e" "$i" > /tmp/nucleo-v492/STATUS.json
          printf '%s\n' "$GITHUB_SHA" > /tmp/nucleo-v492/SOURCE_COMMIT.txt
          cat /tmp/nucleo-v492/STATUS.json
      - run: python3 MIGRACAO/verify_integrity.py --all
      - uses: actions/upload-artifact@v4
        with:
          name: integrated-v492
          path: /tmp/nucleo-v492
  archive:
    needs: evaluate
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: evidencias-cientificas
      - uses: actions/download-artifact@v4
        with:
          name: integrated-v492
          path: /tmp/nucleo-v492
      - run: |
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          target=Path('EVIDENCIAS/BRUTOS/NUCLEO_V492_V691')
          assert not target.exists()
          shutil.copytree('/tmp/nucleo-v492',target)
          (target/'SHA256.json').write_text(json.dumps([dict(path=str(f.relative_to(target)),sha256=hashlib.sha256(f.read_bytes()).hexdigest()) for f in sorted(target.rglob('*')) if f.is_file()],indent=2))
          PY
          git add -f EVIDENCIAS/BRUTOS/NUCLEO_V492_V691
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Archive V492-V691 integrated pilot including failures'
          git push origin HEAD:refs/heads/evidencias-cientificas
