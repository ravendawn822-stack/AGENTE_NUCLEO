name: Experimentos 04CD e 05A
on:
  push:
    branches: [experimento-04]
    paths:
      - 'EXPERIMENTO_04/**'
      - 'EXPERIMENTO_05/**'
      - '.github/workflows/experimento-04.yml'
permissions:
  contents: read
concurrency:
  group: exp04-smoke
  cancel-in-progress: true
jobs:
  experiments:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify historical artifacts
        run: python3 MIGRACAO/verify_integrity.py
      - name: Regression tests 04A/B
        run: |
          python3 EXPERIMENTO_04/pilot.py --self-test
          python3 EXPERIMENTO_04/selection.py --self-test
      - name: Test composition and abstention
        run: python3 EXPERIMENTO_04/composition.py --self-test
      - name: Run 04CD
        run: python3 EXPERIMENTO_04/composition.py --output EXPERIMENTO_04/ci_04cd
      - name: Test numeric interpreter and synthesis
        run: python3 EXPERIMENTO_05/programs.py --self-test
      - name: Run 05A
        run: python3 EXPERIMENTO_05/programs.py --output EXPERIMENTO_05/ci_05a
      - name: Verify historical artifacts again
        run: python3 MIGRACAO/verify_integrity.py
      - name: Preserve experiment records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exp04cd-05a-results
          path: |
            EXPERIMENTO_04/ci_04cd/
            EXPERIMENTO_05/ci_05a/
          retention-days: 30
          if-no-files-found: warn
